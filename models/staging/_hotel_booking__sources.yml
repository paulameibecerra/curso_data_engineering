version: 2

sources:

  - name: hotel_project_bronze
    schema: HOTEL
    database: PROJECT_BRONZE

    quoting:
      database: false
      schema: false
      identifier: false

    tables:

      - name: hotel_booking
        identifier: HOTEL_BOOKING
        description: "Raw Bronze table containing all hotel booking records."

        columns:

          - name: hotel
            description: "Type of hotel where the booking was made (City Hotel or Resort Hotel)."
            tests:
              - not_null

          - name: is_canceled
            description: "Indicates whether the booking was canceled (1 = canceled, 0 = not canceled)."
            tests:
              - not_null

          - name: lead_time
            description: "Number of days between the booking date and the arrival date."
            tests:
              - not_null
              - positive_values

          - name: arrival_date_year
            description: "Year of arrival."
            tests:
              - not_null

          - name: arrival_date_month
            description: "Month of arrival (string name of the month)."
            tests:
              - not_null

          - name: arrival_date_week_number
            description: "ISO week number of the year corresponding to the arrival date."
            tests:
              - not_null

          - name: arrival_date_day_of_month
            description: "Day of the month of arrival."
            tests:
              - not_null

          - name: stays_in_weekend_nights
            description: "Number of weekend nights (Saturday and Sunday) the guest stayed or booked."
            tests:
              - not_null
              - positive_values

          - name: stays_in_week_nights
            description: "Number of week nights (Monday to Friday) the guest stayed or booked."
            tests:
              - not_null
              - positive_values

          - name: adults
            description: "Number of adults included in the booking."
            tests:
              - not_null
              - positive_values

          - name: children
            description: "Number of children included in the booking. Can contain nulls or zeros."

          - name: babies
            description: "Number of babies included in the booking."
            tests:
              - not_null

          - name: meal
            description: "Type of meal plan: Undefined, SC (Self Catering), BB (Bed & Breakfast), HB (Half Board), FB (Full Board)."
            tests:
              - not_null

          - name: country
            description: "Country of origin represented by ISO 3166-1 alpha-3 country code."
            tests:
              - not_null:
                  config:
                    severity: warn

          - name: market_segment
            description: "Market segment designation (e.g., Direct, Corporate, Online TA, Offline TA/TO, Groups)."
            tests:
              - not_null

          - name: distribution_channel
            description: "Channel through which the booking was made (e.g., TA/TO, Direct, Corporate)."
            tests:
              - not_null

          - name: is_repeated_guest
            description: "Indicates if the guest has stayed before (1 = repeated guest, 0 = first-time guest)."
            

          - name: previous_cancellations
            description: "Number of previous bookings that were canceled by the customer."
            tests:
              - positive_values

          - name: previous_bookings_not_canceled
            description: "Number of previous bookings that were not canceled."
            tests:
              - positive_values

          - name: reserved_room_type
            description: "Code identifying the room type initially reserved (letters A–L)."
            tests:
              - not_null

          - name: assigned_room_type
            description: "Code identifying the room type actually assigned at check-in."
            tests:
              - not_null

          - name: booking_changes
            description: "Number of changes made to the booking."
            tests:
              - not_null
              - positive_values

          - name: deposit_type
            description: "Type of deposit made: No Deposit, Non Refund, or Refundable."
            tests:
              - not_null

          - name: agent
            description: "Travel agency ID responsible for the booking. Can be null."

          - name: company
            description: "Company ID representing corporate bookings. Can be null."

          - name: days_in_waiting_list
            description: "Number of days the booking was kept on the waiting list."
            tests:
              - not_null
              - positive_values

          - name: customer_type
            description: "Customer classification: Contract, Group, Transient, or Transient-Party."
            tests:
              - not_null

          - name: adr
            description: "Average Daily Rate (ADR) defined as total rental revenue divided by the number of nights. Can be zero."
            tests:
              - not_null

          - name: required_car_parking_spaces
            description: "Number of parking spaces requested by the guest."
            tests:
              - not_null

          - name: total_of_special_requests
            description: "Number of special requests made by the guest."
            tests:
              - not_null

          - name: reservation_status
            description: "Final status of the booking (e.g., Check-Out, Canceled, No-Show)."
            tests:
              - not_null

          - name: reservation_status_date
            description: "Date on which the reservation status was last updated."
            tests:
              - not_null

          - name: name
            description: "Guest name as provided during booking."

          - name: email
            description: "Guest email address. Can contain invalid or masked values."

          - name: phone_number
            description: "Guest phone number."

          - name: credit_card
            description: "Masked customer credit card number (not real card numbers)."

          - name: _FIVETRAN_SYNCED
            description: "Timestamp indicating when the record was ingested by Fivetran."

    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
