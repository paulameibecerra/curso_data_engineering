name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_new_project:


    base:
      +schema: "PROJECT_BRONZE"
      +materialized: view

    staging:
      +schema: "PROJECT_SILVER"
      +materialized: view

      base:
        +materialized: view

      staging:
        +materialized: view

    marts:
      +schema: "PROJECT_GOLD"

      core:
        +materialized: table


flags:
  require_generic_test_arguments_property: true
